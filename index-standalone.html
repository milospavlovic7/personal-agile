    // =========================================================================
    // 6. MAIN APP COMPONENT
    // =========================================================================
    
    function App() {
      const selectedWeek = useMomentumStore(s => s.selectedWeek);
      const categories = useMomentumStore(s => s.categories);
      const subcategories = useMomentumStore(s => s.subcategories);
      const tasks = useMomentumStore(s => s.tasks);
      const dailyFocus = useMomentumStore(s => s.dailyFocus);
      const search = useMomentumStore(s => s.searchQuery);
      const priFilter = useMomentumStore(s => s.priorityFilter);
      const effFilter = useMomentumStore(s => s.effortFilter);
      
      const collapsedCategories = useMomentumStore(s => s.collapsedCategories);
      
      const setCommandPaletteOpen = useMomentumStore(s => s.setCommandPaletteOpen);
      const cmdOpen = useMomentumStore(s => s.commandPaletteOpen);
      const editingTask = useMomentumStore(s => s.editingTask);
      const setEditingTask = useMomentumStore(s => s.setEditingTask);

      const [newCategoryModal, setNewCategoryModal] = useState(false);

      // Keyboard Shortcut hooks
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCommandPaletteOpen(!cmdOpen);
          }
          if (e.key === 'Escape') {
            setCommandPaletteOpen(false);
            setEditingTask(null);
            setNewCategoryModal(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [cmdOpen]);

      // Calculate Rollover and week active cards
      const activeSprintTasks = useMemo(() => {
        return tasks.filter(t => {
          if (t.status === "backlog") return false;
          // Normal current week scheduling
          if (t.sprintWeek === selectedWeek) return true;
          // Rollover: Incomplete task scheduled in the PAST
          if (t.sprintWeek && t.sprintWeek < selectedWeek && t.status !== "done") return true;
          return false;
        });
      }, [tasks, selectedWeek]);

      const backlogTasks = useMemo(() => {
        return tasks.filter(t => t.status === "backlog");
      }, [tasks]);

      return (
        <React.Fragment>
          <Header onAddCategory={() => setNewCategoryModal(true)} />
          <Sidebar activeSprintTasks={activeSprintTasks} />
          
          <main>
            {[...categories]
              .sort((a, b) => a.order - b.order)
              .map(cat => (
                <CategorySection
                  key={cat.id}
                  category={cat}
                  subcategories={subcategories[cat.id] || []}
                  activeSprintTasks={activeSprintTasks.filter(t => t.categoryId === cat.id)}
                />
              ))
            }
            
            <button className="add-category-board-btn" onClick={() => setNewCategoryModal(true)}>
              <Icon name="plus" size={18} />
              <span>Add Category</span>
            </button>
            
            <BacklogDrawer backlogTasks={backlogTasks} />
          </main>

          {/* Core Modals */}
          {newCategoryModal && <AddCategoryModal onClose={() => setNewCategoryModal(false)} />}
          {editingTask && <TaskEditorModal task={editingTask} onClose={() => setEditingTask(null)} />}
          {cmdOpen && <CommandPalette />}
        </React.Fragment>
      );
    }

    // =========================================================================
    // 7. HEADER COMPONENT
    // =========================================================================
    
    function Header({ onAddCategory }) {
      const selectedWeek = useMomentumStore(s => s.selectedWeek);
      const setSelectedWeek = useMomentumStore(s => s.setSelectedWeek);
      const autosave = useMomentumStore(s => s.autosaveIndicator);
      const importState = useMomentumStore(s => s.importState);
      const tasks = useMomentumStore(s => s.tasks);
      const categories = useMomentumStore(s => s.categories);
      const subcategories = useMomentumStore(s => s.subcategories);
      
      const fileInputRef = useRef(null);

      const weekOptions = useMemo(() => {
        return generateWeekDropdownOptions(selectedWeek, 8);
      }, [selectedWeek]);

      const handlePrevWeek = () => {
        setSelectedWeek(shiftWeekKey(selectedWeek, -1));
      };

      const handleNextWeek = () => {
        setSelectedWeek(shiftWeekKey(selectedWeek, 1));
      };

      // Export state to momentum-data.json
      const handleExport = () => {
        const fullState = {
          tasks: useMomentumStore.getState().tasks,
          categories: useMomentumStore.getState().categories,
          subcategories: useMomentumStore.getState().subcategories,
          selectedWeek: useMomentumStore.getState().selectedWeek,
          dailyFocus: useMomentumStore.getState().dailyFocus,
          collapsedCategories: Array.from(useMomentumStore.getState().collapsedCategories),
          collapsedSubcategories: Array.from(useMomentumStore.getState().collapsedSubcategories)
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullState, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "momentum-data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportClick = () => {
        fileInputRef.current.click();
      };

      const handleFileImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const success = importState(evt.target.result);
          if (success) {
            alert("App state loaded successfully!");
          } else {
            alert("Invalid JSON format. Please load a valid momentum-data.json file.");
          }
        };
        reader.readAsText(file);
      };

      return (
        <header>
          <div className="header-left">
            <div className="logo-container">
              <span className="logo-icon"></span>
              <span className="logo-text">MOMENTUM</span>
            </div>
            
            <div className="sprint-navigation">
              <button className="sprint-nav-btn" onClick={handlePrevWeek} title="Previous Sprint">
                <Icon name="chevronLeft" size={14} />
              </button>
              
              <div className="sprint-select-wrapper">
                <select
                  className="sprint-select"
                  value={selectedWeek}
                  onChange={(e) => setSelectedWeek(e.target.value)}
                >
                  {weekOptions.map(w => (
                    <option key={w} value={w}>
                      Week {w.split('-W')[1]} ({formatWeekRange(w)})
                    </option>
                  ))}
                </select>
              </div>

              <button className="sprint-nav-btn" onClick={handleNextWeek} title="Next Sprint">
                <Icon name="chevronRight" size={14} />
              </button>
            </div>
          </div>

          <div className="header-right">
            <div className={`autosave-badge ${autosave}`}>
              <span className="autosave-dot"></span>
              <span>{autosave === "saving" ? "Autosaving..." : autosave === "error" ? "Save Failed" : "Synced"}</span>
            </div>

            <button className="header-btn" onClick={handleExport} title="Save State to File">
              <Icon name="export" size={12} />
              <span>Export</span>
            </button>

            <button className="header-btn" onClick={handleImportClick} title="Load State from File">
              <Icon name="import" size={12} />
              <span>Import</span>
            </button>
            
            <input
              type="file"
              ref={fileInputRef}
              style={{ display: 'none' }}
              accept=".json"
              onChange={handleFileImport}
            />

            <button className="header-btn primary" onClick={onAddCategory}>
              <Icon name="plus" size={12} />
              <span>Add Category</span>
            </button>
          </div>
        </header>
      );
    }

    // =========================================================================
    // 8. SIDEBAR COMPONENT
    // =========================================================================
    
    function Sidebar({ activeSprintTasks }) {
      const dailyFocusIds = useMomentumStore(s => s.dailyFocus);
      const tasks = useMomentumStore(s => s.tasks);
      const toggleDailyFocus = useMomentumStore(s => s.toggleDailyFocus);
      const setCommandPaletteOpen = useMomentumStore(s => s.setCommandPaletteOpen);
      const setEditingTask = useMomentumStore(s => s.setEditingTask);

      // Extract details for daily focus tasks
      const focusTasks = useMemo(() => {
        return tasks.filter(t => dailyFocusIds.includes(t.id));
      }, [tasks, dailyFocusIds]);

      // Velocity/Stats Calculation
      const stats = useMemo(() => {
        const total = activeSprintTasks.length;
        const completed = activeSprintTasks.filter(t => t.status === "done").length;
        const inProgress = activeSprintTasks.filter(t => t.status === "in_progress").length;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        return { total, completed, inProgress, percent };
      }, [activeSprintTasks]);

      // Category share mapping
      const categoryShare = useMemo(() => {
        const counts = {};
        activeSprintTasks.forEach(t => {
          counts[t.categoryId] = (counts[t.categoryId] || 0) + 1;
        });
        return counts;
      }, [activeSprintTasks]);

      const categories = useMomentumStore(s => s.categories);

      return (
        <aside>
          <div className="sidebar-top">
            
            {/* Daily Focus Section */}
            <div className="sidebar-section">
              <div className="sidebar-section-title">
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <Icon name="focus" size={10} className="focus" style={{ color: 'var(--accent-purple)' }} />
                  <span>Daily Focus</span>
                </div>
                <span style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{focusTasks.filter(t=>t.status==='done').length}/{focusTasks.length}</span>
              </div>
              
              <div className="daily-focus-list">
                {focusTasks.length > 0 ? (
                  focusTasks.map(task => (
                    <div
                      key={task.id}
                      className="daily-focus-item"
                      onClick={() => setEditingTask(task)}
                    >
                      <span className={`daily-focus-text ${task.status === 'done' ? 'completed' : ''}`}>
                        {task.description}
                      </span>
                      <button
                        className="daily-focus-btn"
                        onClick={(e) => {
                          e.stopPropagation();
                          toggleDailyFocus(task.id);
                        }}
                        title="Remove Focus"
                      >
                        <Icon name="close" size={10} />
                      </button>
                    </div>
                  ))
                ) : (
                  <div className="daily-focus-empty">
                    Double-click or edit a task card to pin it here. Keep your day structured.
                  </div>
                )}
              </div>
            </div>

            {/* Weekly Sprint Progress Card */}
            <div className="sidebar-section">
              <div className="sidebar-section-title">
                <Icon name="terminal" size={10} />
                <span>Sprint Velocity</span>
              </div>
              
              <div className="stats-card">
                <div className="stats-row">
                  <span style={{ color: 'var(--text-secondary)' }}>Completion</span>
                  <span className="stats-value">{stats.percent}%</span>
                </div>
                
                <div className="stats-progress-container">
                  <div className="stats-progress-bar" style={{ width: `${stats.percent}%` }}></div>
                </div>

                <div className="stats-row" style={{ fontSize: '11px', marginTop: '4px' }}>
                  <span style={{ color: 'var(--text-muted)' }}>
                    Tasks: {stats.completed} done / {stats.total} total
                  </span>
                </div>

                <div className="stats-categories">
                  {categories.map(cat => {
                    const cnt = categoryShare[cat.id] || 0;
                    if (cnt === 0) return null;
                    return (
                      <div key={cat.id} className="stats-cat-item">
                        <span className="stats-cat-name">
                          <span className="stats-cat-dot" style={{ backgroundColor: cat.color }}></span>
                          <span style={{ textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap', maxWidth: '140px' }}>
                            {cat.name}
                          </span>
                        </span>
                        <span style={{ fontFamily: 'Fira Code, monospace' }}>{cnt}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

          </div>

          <div className="sidebar-footer">
            <div className="shortcut-row">
              <span>Command Palette</span>
              <span className="shortcut-key">Ctrl + K</span>
            </div>
            <div className="shortcut-row">
              <span>Exit Modal</span>
              <span className="shortcut-key">Esc</span>
            </div>
            <div style={{ textAlign: 'center', marginTop: '6px', fontSize: '9px', color: 'var(--text-muted)' }}>
              Momentum OS v1.0
            </div>
          </div>
        </aside>
      );
    }

    // =========================================================================
    // 9. CATEGORY SECTION SYSTEM (Swimlanes layout)
    // =========================================================================
    
    function CategorySection({ category, subcategories, activeSprintTasks }) {
      const toggleCollapse = useMomentumStore(s => s.toggleCollapseCategory);
      const isCollapsed = useMomentumStore(s => s.collapsedCategories).has(category.id);
      const addSubcategory = useMomentumStore(s => s.addSubcategory);
      const deleteCategory = useMomentumStore(s => s.deleteCategory);
      
      const [isAddingSub, setIsAddingSub] = useState(false);
      const [subName, setSubName] = useState("");

      const handleAddSub = (e) => {
        e.preventDefault();
        if (subName.trim()) {
          addSubcategory(category.id, subName.trim());
          setSubName("");
          setIsAddingSub(false);
        }
      };

      const handleDelete = (e) => {
        e.stopPropagation();
        if (confirm(`Are you sure you want to delete category "${category.name}" and all its tasks?`)) {
          deleteCategory(category.id);
        }
      };

      if (isCollapsed) {
        return (
          <div className="category-section collapsed" style={{ '--cat-accent': category.color }}>
            <div className="category-header" onClick={() => toggleCollapse(category.id)}>
              <span className="category-accent-bar"></span>
              <div className="category-title-vertical">{category.name}</div>
              <span className="category-count" style={{ marginTop: 'auto' }}>
                {activeSprintTasks.length}
              </span>
            </div>
          </div>
        );
      }

      return (
        <div className="category-section" style={{ '--cat-accent': category.color }}>
          <div className="category-header" onClick={() => toggleCollapse(category.id)}>
            <div className="category-header-left">
              <span className="category-accent-bar"></span>
              <span className="category-title">{category.name}</span>
              <span className="category-count">{activeSprintTasks.length}</span>
            </div>
            
            <div className="category-actions" onClick={e => e.stopPropagation()}>
              <button
                className="category-action-btn"
                onClick={() => setIsAddingSub(!isAddingSub)}
                title="Add Swimlane"
              >
                <Icon name="plus" size={12} />
              </button>
              <button
                className="category-action-btn"
                onClick={handleDelete}
                title="Delete Category"
              >
                <Icon name="trash" size={12} />
              </button>
              <button
                className="category-action-btn"
                onClick={() => toggleCollapse(category.id)}
                title="Collapse Column"
              >
                <Icon name="chevronLeft" size={12} />
              </button>
            </div>
          </div>

          <div className="category-content-container">
            {isAddingSub && (
              <form onSubmit={handleAddSub} style={{ display: 'flex', gap: '4px', marginBottom: '4px' }}>
                <input
                  type="text"
                  className="quick-create-input"
                  placeholder="New Swimlane Name..."
                  value={subName}
                  onChange={e => setSubName(e.target.value)}
                  autoFocus
                />
                <button type="submit" className="header-btn primary" style={{ height: '26px', padding: '0 8px' }}>Add</button>
                <button type="button" className="header-btn" onClick={() => setIsAddingSub(false)} style={{ height: '26px', padding: '0 8px' }}>X</button>
              </form>
            )}

            {subcategories.length > 0 ? (
              [...subcategories]
                .sort((a, b) => a.order - b.order)
                .map(sub => (
                  <SubcategoryRow
                    key={sub.id}
                    category={category}
                    subcategory={sub}
                    tasks={activeSprintTasks.filter(t => t.subcategoryId === sub.id)}
                  />
                ))
            ) : (
              <SubcategoryRow
                key="default-gen"
                category={category}
                subcategory={{ id: "General", name: "General" }}
                tasks={activeSprintTasks.filter(t => t.subcategoryId === "General" || !t.subcategoryId)}
              />
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 10. SUBCATEGORY ROW SWIMLANES
    // =========================================================================
    
    function SubcategoryRow({ category, subcategory, tasks }) {
      const collapsedSubcategories = useMomentumStore(s => s.collapsedSubcategories);
      const toggleCollapse = useMomentumStore(s => s.toggleCollapseSubcategory);
      const deleteSub = useMomentumStore(s => s.deleteSubcategory);
      const isCollapsed = collapsedSubcategories.has(subcategory.id);

      const handleDelete = (e) => {
        e.stopPropagation();
        if (subcategory.id === "General") return;
        if (confirm(`Are you sure you want to delete swimlane "${subcategory.name}"? Tasks inside will be archived.`)) {
          deleteSub(category.id, subcategory.id);
        }
      };

      return (
        <div className={`subcategory-swimlane ${isCollapsed ? 'collapsed' : ''}`}>
          <div className="subcategory-header" onClick={() => toggleCollapse(subcategory.id)}>
            <div className="subcategory-header-left">
              <button className="subcategory-header-btn">
                <Icon
                  name="doubleChevron"
                  size={10}
                  style={{
                    transform: isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)',
                    transition: 'transform var(--transition-fast)'
                  }}
                />
              </button>
              <span>{subcategory.name}</span>
              <span style={{ fontSize: '10px', color: 'var(--text-muted)' }}>({tasks.length})</span>
            </div>

            {subcategory.id !== "General" && (
              <button
                className="category-action-btn"
                style={{ width: '18px', height: '18px' }}
                onClick={handleDelete}
                title="Delete Swimlane"
              >
                <Icon name="trash" size={10} />
              </button>
            )}
          </div>

          <div className="subcategory-grid">
            <BoardColumn
              status="tasks"
              category={category}
              subcategory={subcategory}
              tasks={tasks.filter(t => t.status === "tasks")}
            />
            <BoardColumn
              status="in_progress"
              category={category}
              subcategory={subcategory}
              tasks={tasks.filter(t => t.status === "in_progress")}
            />
            <BoardColumn
              status="done"
              category={category}
              subcategory={subcategory}
              tasks={tasks.filter(t => t.status === "done")}
            />
          </div>
        </div>
      );
    }

    // =========================================================================
    // 11. WORKFLOW COLUMNS
    // =========================================================================
    
    function BoardColumn({ status, category, subcategory, tasks }) {
      const moveTask = useMomentumStore(s => s.moveTask);
      const addTask = useMomentumStore(s => s.addTask);
      const selectedWeek = useMomentumStore(s => s.selectedWeek);
      
      const [dragOver, setDragOver] = useState(false);
      const [isAdding, setIsAdding] = useState(false);
      const [taskDesc, setTaskDesc] = useState("");

      // HTML5 Drag Handlers
      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDragEnter = (e) => {
        setDragOver(true);
      };

      const handleDragLeave = () => {
        setDragOver(false);
      };

      const handleDrop = (e) => {
        setDragOver(false);
        const taskId = e.dataTransfer.getData("text/plain");
        if (taskId) {
          moveTask(taskId, status, category.id, subcategory.id);
        }
      };

      const handleQuickSubmit = (e) => {
        e.preventDefault();
        if (taskDesc.trim()) {
          addTask({
            description: taskDesc.trim(),
            categoryId: category.id,
            subcategoryId: subcategory.id,
            sprintWeek: selectedWeek,
            status: status
          });
          setTaskDesc("");
          setIsAdding(false);
        }
      };

      // Sorting: pinned first, then priority (null last), then creation date
      const sortedTasks = useMemo(() => {
        return [...tasks].sort((a, b) => {
          if (a.pinned && !b.pinned) return -1;
          if (!a.pinned && b.pinned) return 1;
          
          const priA = a.priority === null ? 999 : a.priority;
          const priB = b.priority === null ? 999 : b.priority;
          if (priA !== priB) return priA - priB;
          
          return new Date(a.createdAt) - new Date(b.createdAt);
        });
      }, [tasks]);

      return (
        <div
          className={`board-column ${status} ${dragOver ? 'drag-over' : ''}`}
          onDragOver={handleDragOver}
          onDragEnter={handleDragEnter}
          onDragLeave={handleDragLeave}
          onDrop={handleDrop}
        >
          <div className="board-column-header">
            <div className="board-column-title-container">
              <span className="board-column-dot"></span>
              <span>{status === "tasks" ? "Todo" : status === "in_progress" ? "Active" : "Done"}</span>
            </div>
            <span style={{ fontSize: '10px', fontFamily: 'Fira Code' }}>{tasks.length}</span>
          </div>

          <div className="task-list">
            {sortedTasks.map(t => (
              <TaskCard key={t.id} task={t} />
            ))}
          </div>

          <div className="quick-create-container">
            {isAdding ? (
              <form onSubmit={handleQuickSubmit} className="quick-create-form">
                <input
                  type="text"
                  className="quick-create-input"
                  placeholder="Task info..."
                  value={taskDesc}
                  onChange={e => setTaskDesc(e.target.value)}
                  onBlur={() => {
                    // Small delay to allow clicking submit if needed
                    setTimeout(() => setIsAdding(false), 200);
                  }}
                  autoFocus
                />
              </form>
            ) : (
              <button className="quick-create-trigger" onClick={() => setIsAdding(true)}>
                <Icon name="plus" size={10} />
              </button>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 12. TASK CARD COMPONENT
    // =========================================================================
    
    function TaskCard({ task }) {
      const togglePinTask = useMomentumStore(s => s.togglePinTask);
      const setEditingTask = useMomentumStore(s => s.setEditingTask);
      const toggleDailyFocus = useMomentumStore(s => s.toggleDailyFocus);
      const dailyFocusIds = useMomentumStore(s => s.dailyFocus);
      const selectedWeek = useMomentumStore(s => s.selectedWeek);

      const [isDragging, setIsDragging] = useState(false);

      const handleDragStart = (e) => {
        setIsDragging(true);
        e.dataTransfer.setData("text/plain", task.id);
        // Custom drag image could be set here
      };

      const handleDragEnd = () => {
        setIsDragging(false);
      };

      // Rollover detection indicator
      const isRollover = useMemo(() => {
        return task.sprintWeek && task.sprintWeek < selectedWeek && task.status !== "done";
      }, [task, selectedWeek]);

      const subtasksDone = task.subtasks ? task.subtasks.filter(s => s.done).length : 0;
      const subtasksTotal = task.subtasks ? task.subtasks.length : 0;

      const isDailyFocus = dailyFocusIds.includes(task.id);

      return (
        <div
          className={`task-card ${task.pinned ? 'pinned' : ''} ${isDragging ? 'dragging' : ''}`}
          draggable
          onDragStart={handleDragStart}
          onDragEnd={handleDragEnd}
          onDoubleClick={() => setEditingTask(task)}
        >
          <div className="task-card-header">
            <span className="task-description">{task.description}</span>
            <div className="task-card-pins">
              <button
                className={`task-card-pin-btn ${task.pinned ? 'active' : ''}`}
                onClick={(e) => {
                  e.stopPropagation();
                  togglePinTask(task.id);
                }}
                title={task.pinned ? "Unpin Task" : "Pin to Top"}
              >
                <Icon name="pin" size={10} />
              </button>
            </div>
          </div>

          <div className="task-card-footer">
            <div className="task-tags-left">
              {task.priority && (
                <span className={`tag-pill priority priority-${task.priority}`}>
                  P{task.priority}
                </span>
              )}
              {task.effort && (
                <span className={`tag-pill effort effort-${task.effort.toLowerCase()}`}>
                  {task.effort}
                </span>
              )}
              {isRollover && (
                <span className="task-rollover-badge" title="Rolled over from past week">
                  Rollover
                </span>
              )}
            </div>

            {subtasksTotal > 0 && (
              <div className="task-subtask-summary">
                <Icon name="check" size={9} />
                <span>{subtasksDone}/{subtasksTotal}</span>
              </div>
            )}
            
            <button
              style={{
                background: 'transparent',
                border: 'none',
                color: isDailyFocus ? 'var(--accent-purple)' : 'var(--text-muted)',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center'
              }}
              onClick={(e) => {
                e.stopPropagation();
                toggleDailyFocus(task.id);
              }}
              title={isDailyFocus ? "Pinned to Daily Focus" : "Pin to Daily Focus"}
            >
              <Icon name="focus" size={10} />
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 13. BACKLOG PERMANENT DRAWER COLUMN
    // =========================================================================
    
    function BacklogDrawer({ backlogTasks }) {
      const moveTask = useMomentumStore(s => s.moveTask);
      const addTask = useMomentumStore(s => s.addTask);
      const categories = useMomentumStore(s => s.categories);
      
      const [dragOver, setDragOver] = useState(false);
      const [backlogSearch, setBacklogSearch] = useState("");
      const [catFilter, setCatFilter] = useState("all");
      const [priSort, setPriSort] = useState("all");
      const [quickDesc, setQuickDesc] = useState("");
      const [selectedCatId, setSelectedCatId] = useState(categories[0]?.id || "General");

      const handleDragOver = (e) => e.preventDefault();
      
      const handleDrop = (e) => {
        setDragOver(false);
        const taskId = e.dataTransfer.getData("text/plain");
        if (taskId) {
          moveTask(taskId, "backlog", null, null);
        }
      };

      const handleQuickSubmit = (e) => {
        e.preventDefault();
        if (quickDesc.trim()) {
          addTask({
            description: quickDesc.trim(),
            categoryId: selectedCatId,
            subcategoryId: "General",
            sprintWeek: null,
            status: "backlog"
          });
          setQuickDesc("");
        }
      };

      // Filtered Backlog calculation
      const filteredBacklog = useMemo(() => {
        let list = backlogTasks.filter(t => {
          const matchSearch = t.description.toLowerCase().includes(backlogSearch.toLowerCase());
          const matchCat = catFilter === "all" || t.categoryId === catFilter;
          return matchSearch && matchCat;
        });

        // Sorting priority
        if (priSort === "high") {
          list.sort((a, b) => (a.priority || 99) - (b.priority || 99));
        } else if (priSort === "date") {
          list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }
        
        return list;
      }, [backlogTasks, backlogSearch, catFilter, priSort]);

      return (
        <div className="backlog-section">
          <div className="backlog-header">
            <div className="backlog-header-left">
              <Icon name="folder" size={13} style={{ color: 'var(--text-secondary)' }} />
              <span className="backlog-title">Backlog</span>
            </div>
            <span className="category-count">{backlogTasks.length}</span>
          </div>

          <div className="backlog-search-container">
            <div className="backlog-search-row">
              <Icon name="search" size={12} style={{ color: 'var(--text-muted)' }} />
              <input
                type="text"
                className="backlog-search-input"
                placeholder="Search backlog..."
                value={backlogSearch}
                onChange={e => setBacklogSearch(e.target.value)}
              />
            </div>

            <div className="backlog-filters">
              <select
                className="backlog-filter-select"
                value={catFilter}
                onChange={e => setCatFilter(e.target.value)}
              >
                <option value="all">All Categories</option>
                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>

              <select
                className="backlog-filter-select"
                value={priSort}
                onChange={e => setPriSort(e.target.value)}
              >
                <option value="all">Natural Sort</option>
                <option value="high">Priority (1 &rarr; 4)</option>
                <option value="date">Newest Created</option>
              </select>
            </div>
          </div>

          <div
            className={`backlog-content ${dragOver ? 'drag-over' : ''}`}
            onDragOver={handleDragOver}
            onDragEnter={() => setDragOver(true)}
            onDragLeave={() => setDragOver(false)}
            onDrop={handleDrop}
          >
            <form onSubmit={handleQuickSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '12px' }}>
              <input
                type="text"
                className="quick-create-input"
                style={{ height: '30px' }}
                placeholder="Backlog fast capture objective..."
                value={quickDesc}
                onChange={e => setQuickDesc(e.target.value)}
              />
              <div style={{ display: 'flex', gap: '4px' }}>
                <select
                  className="backlog-filter-select"
                  style={{ height: '24px' }}
                  value={selectedCatId}
                  onChange={e => setSelectedCatId(e.target.value)}
                >
                  {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <button type="submit" className="header-btn primary" style={{ height: '24px', flexGrow: 1, padding: 0, justifyContent: 'center' }}>
                  Capture
                </button>
              </div>
            </form>

            <div className="backlog-cards-container">
              {filteredBacklog.map(task => {
                const cat = categories.find(c => c.id === task.categoryId) || { name: 'General', color: '#666' };
                return (
                  <div
                    key={task.id}
                    className="task-card backlog-card"
                    draggable
                    onDragStart={e => {
                      e.dataTransfer.setData("text/plain", task.id);
                    }}
                    onDoubleClick={() => useMomentumStore.getState().setEditingTask(task)}
                  >
                    <div className="backlog-card-header">
                      <span style={{ color: cat.color, fontWeight: 600 }}>{cat.name}</span>
                      {task.priority && <span>P{task.priority}</span>}
                    </div>
                    <span className="task-description">{task.description}</span>
                  </div>
                );
              })}
              
              {filteredBacklog.length === 0 && (
                <div className="daily-focus-empty" style={{ padding: '24px' }}>
                  No backlog tasks fit these criteria. Drag tasks here to store them long-term.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 14. TASK DETAIL / CHECKLIST EDITOR MODAL
    // =========================================================================
    
    function TaskEditorModal({ task, onClose }) {
      const updateTask = useMomentumStore(s => s.updateTask);
      const deleteTask = useMomentumStore(s => s.deleteTask);
      const categories = useMomentumStore(s => s.categories);
      const subcategories = useMomentumStore(s => s.subcategories);

      const [desc, setDesc] = useState(task.description);
      const [priority, setPriority] = useState(task.priority || "");
      const [effort, setEffort] = useState(task.effort || "");
      const [notes, setNotes] = useState(task.notes || "");
      const [catId, setCatId] = useState(task.categoryId);
      const [subCatId, setSubCatId] = useState(task.subcategoryId || "General");
      
      const [subtasks, setSubtasks] = useState(task.subtasks || []);
      const [newSubtext, setNewSubtext] = useState("");

      const handleSave = () => {
        updateTask(task.id, {
          description: desc,
          priority: priority === "" ? null : parseInt(priority, 10),
          effort: effort === "" ? null : effort,
          notes: notes,
          categoryId: catId,
          subcategoryId: subCatId,
          subtasks: subtasks
        });
        onClose();
      };

      const handleDelete = () => {
        if (confirm("Delete this task permanently?")) {
          deleteTask(task.id);
          onClose();
        }
      };

      const handleAddSub = (e) => {
        e.preventDefault();
        if (newSubtext.trim()) {
          setSubtasks([...subtasks, { id: "st-" + Date.now(), text: newSubtext.trim(), done: false }]);
          setNewSubtext("");
        }
      };

      const handleToggleSub = (stId) => {
        setSubtasks(subtasks.map(s => s.id === stId ? { ...s, done: !s.done } : s));
      };

      const handleRemoveSub = (stId) => {
        setSubtasks(subtasks.filter(s => s.id !== stId));
      };

      const filteredSubcats = subcategories[catId] || [];

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <span className="modal-title">Edit Task Details</span>
              <button className="modal-close-btn" onClick={onClose}>
                <Icon name="close" size={14} />
              </button>
            </div>

            <div className="modal-content">
              <div className="form-group">
                <label className="form-label">Task Description</label>
                <input
                  type="text"
                  className="form-input"
                  value={desc}
                  onChange={e => setDesc(e.target.value)}
                />
              </div>

              <div className="form-row-2">
                <div className="form-group">
                  <label className="form-label">Category</label>
                  <select
                    className="form-select"
                    value={catId}
                    onChange={e => {
                      setCatId(e.target.value);
                      // Switch to first subcategory of new category or General
                      const sublist = subcategories[e.target.value] || [];
                      setSubCatId(sublist[0]?.id || "General");
                    }}
                  >
                    {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Swimlane</label>
                  <select
                    className="form-select"
                    value={subCatId}
                    onChange={e => setSubCatId(e.target.value)}
                  >
                    {filteredSubcats.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    {filteredSubcats.length === 0 && <option value="General">General</option>}
                  </select>
                </div>
              </div>

              <div className="form-row-2">
                <div className="form-group">
                  <label className="form-label">Priority</label>
                  <select className="form-select" value={priority} onChange={e => setPriority(e.target.value)}>
                    <option value="">None</option>
                    <option value="1">P1 (Critical)</option>
                    <option value="2">P2 (High)</option>
                    <option value="3">P3 (Medium)</option>
                    <option value="4">P4 (Low)</option>
                  </select>
                </div>

                <div className="form-group">
                  <label className="form-label">Effort Tag</label>
                  <select className="form-select" value={effort} onChange={e => setEffort(e.target.value)}>
                    <option value="">None</option>
                    <option value="XS">XS (Tiny)</option>
                    <option value="S">S (Small)</option>
                    <option value="M">M (Medium)</option>
                    <option value="L">L (Large)</option>
                    <option value="XL">XL (Epic)</option>
                  </select>
                </div>
              </div>

              <div className="form-group">
                <label className="form-label">Notes</label>
                <textarea
                  className="form-textarea"
                  placeholder="Elaborate details, links, ideas..."
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                />
              </div>

              {/* Checklist Section */}
              <div className="form-group">
                <label className="form-label">Subtask Checklist</label>
                <div className="checklist-container">
                  {subtasks.map(st => (
                    <div key={st.id} className="checklist-row">
                      <input
                        type="checkbox"
                        className="checklist-checkbox"
                        checked={st.done}
                        onChange={() => handleToggleSub(st.id)}
                      />
                      <span className={`checklist-text-input ${st.done ? 'done' : ''}`} style={{ flexGrow: 1 }}>
                        {st.text}
                      </span>
                      <button
                        className="category-action-btn"
                        style={{ width: '18px', height: '18px' }}
                        onClick={() => handleRemoveSub(st.id)}
                      >
                        <Icon name="close" size={10} />
                      </button>
                    </div>
                  ))}
                  
                  <form onSubmit={handleAddSub} style={{ display: 'flex', gap: '4px', marginTop: '4px' }}>
                    <input
                      type="text"
                      className="quick-create-input"
                      style={{ height: '28px' }}
                      placeholder="Add subtask..."
                      value={newSubtext}
                      onChange={e => setNewSubtext(e.target.value)}
                    />
                    <button type="submit" className="header-btn primary" style={{ height: '28px', padding: '0 10px' }}>Add</button>
                  </form>
                </div>
              </div>
            </div>

            <div className="modal-footer">
              <button className="header-btn" onClick={handleDelete} style={{ color: '#ef4444' }}>
                <Icon name="trash" size={12} />
                <span>Delete</span>
              </button>
              
              <div style={{ display: 'flex', gap: '8px' }}>
                <button className="header-btn" onClick={onClose}>Cancel</button>
                <button className="header-btn primary" onClick={handleSave}>Save Changes</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 15. ADD CATEGORY MODAL
    // =========================================================================
    
    function AddCategoryModal({ onClose }) {
      const addCategory = useMomentumStore(s => s.addCategory);
      const [name, setName] = useState("");
      const [color, setColor] = useState("#8b5cf6");

      const colors = [
        "#8b5cf6", // Purple
        "#10b981", // Emerald
        "#3b82f6", // Blue
        "#f59e0b", // Amber
        "#f43f5e", // Rose
        "#ec4899", // Pink
        "#06b6d4", // Cyan
        "#84cc16", // Lime
        "#e11d48", // Crimson
        "#64748b"  // Slate
      ];

      const handleSave = () => {
        if (name.trim()) {
          addCategory(name.trim(), color);
          onClose();
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <span className="modal-title">Create New Category</span>
              <button className="modal-close-btn" onClick={onClose}>
                <Icon name="close" size={14} />
              </button>
            </div>

            <div className="modal-content">
              <div className="form-group">
                <label className="form-label">Category Name</label>
                <input
                  type="text"
                  className="form-input"
                  placeholder="Music Production, Training, Software..."
                  value={name}
                  onChange={e => setName(e.target.value)}
                  autoFocus
                />
              </div>

              <div className="form-group">
                <label className="form-label">Accent Theme Color</label>
                <div className="color-picker-grid">
                  {colors.map(col => (
                    <div
                      key={col}
                      className={`color-dot-option ${color === col ? 'selected' : ''}`}
                      style={{ backgroundColor: col }}
                      onClick={() => setColor(col)}
                    />
                  ))}
                </div>
              </div>
            </div>

            <div className="modal-footer" style={{ justifyContent: 'flex-end', gap: '8px' }}>
              <button className="header-btn" onClick={onClose}>Cancel</button>
              <button className="header-btn primary" onClick={handleSave}>Create Category</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 16. FUZZY COMMAND PALETTE (Ctrl+K)
    // =========================================================================
    
    function CommandPalette() {
      const setOpen = useMomentumStore(s => s.setCommandPaletteOpen);
      const tasks = useMomentumStore(s => s.tasks);
      const categories = useMomentumStore(s => s.categories);
      const selectedWeek = useMomentumStore(s => s.selectedWeek);
      const setSelectedWeek = useMomentumStore(s => s.setSelectedWeek);
      const setEditingTask = useMomentumStore(s => s.setEditingTask);
      
      const [query, setQuery] = useState("");
      const [selectedIndex, setSelectedIndex] = useState(0);

      // Actions / searchable indexes
      const commandItems = useMemo(() => {
        const items = [];

        // Tasks Search
        tasks.forEach(t => {
          items.push({
            type: "task",
            title: t.description,
            subtitle: t.status === "backlog" ? "Backlog" : `Week ${t.sprintWeek?.split('-W')[1]}`,
            badge: t.status.toUpperCase(),
            action: () => {
              setEditingTask(t);
              setOpen(false);
            }
          });
        });

        // Categories jumps
        categories.forEach(c => {
          items.push({
            type: "category",
            title: `Jump to Category: ${c.name}`,
            subtitle: "View horizontal category board",
            badge: "BOARD",
            action: () => {
              // Smooth scroll to category
              const sections = document.querySelectorAll('.category-section');
              sections.forEach(sec => {
                if (sec.textContent.includes(c.name)) {
                  sec.scrollIntoView({ behavior: 'smooth', inline: 'start' });
                }
              });
              setOpen(false);
            }
          });
        });

        // Navigation Commands
        items.push({
          type: "action",
          title: "Go to Current Week Sprint",
          subtitle: "Jump to today's week",
          badge: "NAV",
          action: () => {
            setSelectedWeek(getWeekKey());
            setOpen(false);
          }
        });

        items.push({
          type: "action",
          title: "Next Week Sprint",
          subtitle: "Step week forward",
          badge: "NAV",
          action: () => {
            setSelectedWeek(shiftWeekKey(selectedWeek, 1));
            setOpen(false);
          }
        });

        items.push({
          type: "action",
          title: "Previous Week Sprint",
          subtitle: "Step week backward",
          badge: "NAV",
          action: () => {
            setSelectedWeek(shiftWeekKey(selectedWeek, -1));
            setOpen(false);
          }
        });

        return items;
      }, [tasks, categories, selectedWeek]);

      const filteredItems = useMemo(() => {
        if (!query.trim()) return commandItems.slice(0, 8); // Top default actions
        return commandItems.filter(item => 
          item.title.toLowerCase().includes(query.toLowerCase()) ||
          item.subtitle.toLowerCase().includes(query.toLowerCase())
        ).slice(0, 10);
      }, [commandItems, query]);

      useEffect(() => {
        setSelectedIndex(0);
      }, [query]);

      // Navigation in command palette
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSelectedIndex(prev => (prev + 1) % filteredItems.length);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSelectedIndex(prev => (prev - 1 + filteredItems.length) % filteredItems.length);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (filteredItems[selectedIndex]) {
              filteredItems[selectedIndex].action();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [filteredItems, selectedIndex]);

      return (
        <div className="cmd-palette-backdrop" onClick={() => setOpen(false)}>
          <div className="cmd-palette-box" onClick={e => e.stopPropagation()}>
            <div className="cmd-palette-input-row">
              <Icon name="search" size={16} style={{ color: 'var(--text-secondary)' }} />
              <input
                type="text"
                className="cmd-palette-input"
                placeholder="Fuzzy search tasks, categories, navigation commands..."
                value={query}
                onChange={e => setQuery(e.target.value)}
                autoFocus
              />
            </div>

            <div className="cmd-palette-results">
              {filteredItems.map((item, idx) => (
                <div
                  key={idx}
                  className={`cmd-palette-item ${idx === selectedIndex ? 'selected' : ''}`}
                  onClick={item.action}
                  onMouseEnter={() => setSelectedIndex(idx)}
                >
                  <div className="cmd-palette-item-left">
                    <Icon
                      name={item.type === "task" ? "check" : item.type === "category" ? "folder" : "terminal"}
                      size={12}
                      className="cmd-palette-item-icon"
                    />
                    <div>
                      <span className="cmd-palette-item-text">{item.title}</span>
                      <span className="cmd-palette-item-subtitle">{item.subtitle}</span>
                    </div>
                  </div>
                  <span className="cmd-palette-item-badge">{item.badge}</span>
                </div>
              ))}

              {filteredItems.length === 0 && (
                <div className="cmd-palette-empty">
                  No matching command or task found. Try searching another objective.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render application!
    const container = document.getElementById('app-root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

  </script>
</body>
</html>
